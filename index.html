<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS300 Assignment 1 - Product Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="product-page">
    <header class="image-header">
      <img src="images/IMG_5905.JPG" class="header-img">
      <img src="images/IMG_5904.JPG" class="header-img">
      <img src="images/IMG_5906.JPG" class="header-img">
    </header>
  
    <section class="product-details">
      <h1 class="product-title">Life Sized Pikachu Lego Model</h1>
      <h5 class="product-number">sku #: BK-FIC-THR-JD-978055</h5>
      <span class="category-tag">Collector Edition</span>
      <p class="product-description">A life-sized Pikachu model made entirely out of Lego bricks. Perfect for fans and collectors alike. One of a kind and handbuilt. Over 2,500 pieces used to create this masterpiece.</p>
      
      <div class="price-container">
        <span class="product-price">$499.99</span>
        <span class="original-price">$599.99</span>
      </div>
    </section>

    <footer class="page-footer">
     <button class="cart-button">Add to Cart</button>
   </footer>
  </main>
</body>
</html>
